name: One-time structured CMS import
on:
  push:
    branches: [feature/structured-cms-collections]
    paths:
      - scripts/migrate_structured_lists.py
      - .github/workflows/structured-cms-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline Webflow converter dependencies
        run: python -m pip install beautifulsoup4 PyYAML markdownify
      - name: Convert archived cards to structured CMS
        run: python scripts/migrate_structured_lists.py
      - name: Verify counts, drafts and original /list slugs
        run: |
          python - <<'PY'
          import pathlib, yaml
          root = pathlib.Path('src/content')
          for directory, expected in [('fun-lists', 3), ('event-series', 1), ('events', 7), ('projects', 225)]:
              files = list((root / directory).glob('*.md'))
              assert len(files) == expected, f'{directory}: expected {expected}, got {len(files)}'
              for file in files:
                  record = yaml.safe_load(file.read_text().split('---', 2)[1])
                  assert record['published'] is False, file
                  if directory == 'fun-lists':
                      assert record['legacyPath'] == '/list/' + file.stem + '/', file
          print('Structured content verified.')
          PY
      - name: Retire only obsolete Markdown list snapshots
        run: |
          git rm src/content/lists/*.md src/content/lists/.gitkeep
      - name: Commit converted drafts on review branch
        run: |
          git config user.name "pucz-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/fun-lists src/content/event-series src/content/events src/content/projects src/data/project-archive.md src/data/structured-archive-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Migrate archived lists, events and projects into structured drafts"
            git push origin HEAD:feature/structured-cms-collections
          fi
