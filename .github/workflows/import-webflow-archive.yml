name: One-time Webflow archive migration

on:
  push:
    branches:
      - feature/full-webflow-archive
    paths:
      - scripts/import_webflow_archive.py
      - .github/workflows/import-webflow-archive.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install one-time converter dependencies
        run: python -m pip install beautifulsoup4 markdownify
      - name: Migrate original public Webflow writing into branch
        run: python scripts/import_webflow_archive.py --output .
      - name: Commit imported writing and copied images to review branch
        run: |
          git config user.name "pucz-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles src/content/recipes src/content/lists src/data/archive-lists src/data/webflow-archive-manifest.json public/images/archive public/_redirects
          if ! git diff --cached --quiet; then
            git commit -m "Import Webflow writing and assets [archive generated]"
            git push origin HEAD:feature/full-webflow-archive
          fi
