name: Homepage gallery interaction tests
on:
  pull_request:
    paths:
      - "public/homepage-gallery.js"
      - "public/cursor-drawing.js"
      - "public/editorial-dropcaps.js"
      - "src/styles/site.css"
      - "src/components/CursorDrawing.astro"
      - "src/layouts/EditorialLayout.astro"
      - "src/pages/blog/[slug].astro"
      - "src/pages/articles/[slug].astro"
      - "src/pages/meals/[slug].astro"
      - "src/pages/recipes/[slug].astro"
      - "tests/editorial-decorations.test.cjs"
      - "src/data/homepage-gallery.json"
      - "src/pages/index.astro"
      - ".pages.yml"
      - "tests/homepage-gallery.test.cjs"
      - ".github/workflows/homepage-gallery-test.yml"
  push:
    branches: [main]
    paths:
      - "public/homepage-gallery.js"
      - "public/cursor-drawing.js"
      - "public/editorial-dropcaps.js"
      - "src/styles/site.css"
      - "src/components/CursorDrawing.astro"
      - "src/layouts/EditorialLayout.astro"
      - "src/pages/blog/[slug].astro"
      - "src/pages/articles/[slug].astro"
      - "src/pages/meals/[slug].astro"
      - "src/pages/recipes/[slug].astro"
      - "tests/editorial-decorations.test.cjs"
      - "src/data/homepage-gallery.json"
      - "src/pages/index.astro"
      - ".pages.yml"
      - "tests/homepage-gallery.test.cjs"
permissions:
  contents: read
jobs:
  interaction-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check vanilla JavaScript syntax
        run: node --check public/homepage-gallery.js && node --check public/cursor-drawing.js && node --check public/editorial-dropcaps.js
      - name: Test gallery interactions without external dependencies
        run: node --test tests/homepage-gallery.test.cjs tests/editorial-decorations.test.cjs
