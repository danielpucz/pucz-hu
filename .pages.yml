# Pucz.hu — Git-backed content editing. Site design lives in Astro components.
media:
  input: public/images
  output: /images
  rename: safe

content:
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [".gitkeep"]
    operations:
      rename: false
    view:
      fields: [title, category, published, publishedAt]
      primary: title
      sort: [title, publishedAt]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short description
        type: text
        required: true
      - name: category
        label: Writing category
        type: select
        required: true
        options:
          values:
            - A Better Internet
            - Stuff About Working
            - My Feelings
            - Very Good Lists I’ve Made
            - Upper Middle Class Bragging
      - name: navigationTitle
        label: Optional footer label (when different from title)
        type: string
      - name: legacyPath
        label: Original website path (preserved for migrated posts)
        type: string
      - name: primaryPath
        label: URL group (leave empty for new writing)
        type: select
        options:
          values:
            - blog
            - articles
            - meals
            - recipes
      - name: image
        label: Cover image
        type: image
        required: true
      - name: imageAlt
        label: Cover image description
        type: text
        required: true
      - name: publishedAt
        label: Publication date (optional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: published
        label: Published on website
        type: boolean
        default: false
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown

  - name: recipes
    label: Recipes
    type: collection
    path: src/content/recipes
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [".gitkeep"]
    operations:
      rename: false
    view:
      fields: [title, published, publishedAt]
      primary: title
      sort: [title, publishedAt]
    fields:
      - name: title
        label: Recipe title
        type: string
        required: true
      - name: description
        label: Short description
        type: text
        required: true
      - name: category
        label: Writing category
        type: select
        required: true
        default: Important Food Stuff
        options:
          values:
            - Important Food Stuff
      - name: navigationTitle
        label: Optional footer label (when different from title)
        type: string
      - name: legacyPath
        label: Original website path (preserved for migrated posts)
        type: string
      - name: primaryPath
        label: URL group (leave empty for new writing)
        type: select
        options:
          values:
            - blog
            - articles
            - meals
            - recipes
      - name: image
        label: Cover image
        type: image
        required: true
      - name: imageAlt
        label: Cover image description
        type: text
        required: true
      - name: publishedAt
        label: Publication date (optional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: published
        label: Published on website
        type: boolean
        default: false
      - name: body
        label: Recipe, ingredients and instructions
        type: rich-text
        options:
          format: markdown

  - name: lists
    label: Lists (archive drafts)
    type: collection
    path: src/content/lists
    format: yaml-frontmatter
    filename: "{primary}.md"
    operations:
      rename: false
    view:
      fields: [title, published]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: navigationTitle
        label: Footer label
        type: string
      - name: description
        label: Short description
        type: text
      - name: category
        label: Category
        type: string
        default: "Very Good Lists I’ve Made"
      - name: image
        label: Cover (optional)
        type: image
      - name: imageAlt
        label: Cover description
        type: text
      - name: legacyPath
        label: Original URL
        type: string
      - name: primaryPath
        label: URL group
        type: string
        default: list
      - name: published
        label: Published (keep off until list templates are approved)
        type: boolean
        default: false
      - name: body
        label: Archived introduction and items
        type: rich-text
        options:
          format: markdown
